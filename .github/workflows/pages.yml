name: Publish ROM exporter

on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'tools/**', 'tests/test_web*', '.github/workflows/pages.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/test_web*.mjs
      - run: python3 tools/check_web_assets.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
